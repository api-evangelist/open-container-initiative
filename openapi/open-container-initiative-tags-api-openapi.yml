openapi: 3.1.0
info:
  title: OCI Distribution Specification Blobs Tags API
  description: The Open Container Initiative Distribution Specification standardizes the HTTP API for distributing container images and other content. Registries that implement this specification expose endpoints for managing blobs, manifests, tags, and referrers under the /v2/ namespace.
  version: 1.1.0
  contact:
    name: Open Container Initiative
    url: https://opencontainers.org/
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{registry}
  description: An OCI-compliant container registry
  variables:
    registry:
      default: registry.example.com
      description: The hostname of the registry
tags:
- name: Tags
paths:
  /v2/{name}/tags/list:
    parameters:
    - $ref: '#/components/parameters/Name'
    get:
      summary: List tags in a repository
      operationId: listTags
      parameters:
      - name: n
        in: query
        schema:
          type: integer
        description: Maximum number of tags to return.
      - name: last
        in: query
        schema:
          type: string
        description: Tag name to start listing after, for pagination.
      responses:
        '200':
          description: Tag list returned.
      tags:
      - Tags
components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: The repository name (may contain slashes).
